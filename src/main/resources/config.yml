# McTransfer 1.1.0
messages:
  prefix: "&8[&bMcTransfer&8] "
  no-permission: "&cYou don't have permission to use this command."
  player-only: "&cOnly players can use this command."
  usage: "&cUsage: /transfer <server>"
  unknown-server: "&cUnknown server: &f%server%"
  transferring: "&aConnecting you to &f%server%&a..."
  transfer-failed: "&cCould not start the transfer. Check the destination settings."
  reloaded: "&aConfiguration reloaded."

# MOTD-style display lines for holograms (MiniMessage formatting).
# These do not change the actual multiplayer server-list MOTD.
motd:
  line1: "<bold><gradient:#00C9FC:#FFFFFF>FLOVEXSMP <gray><bold>[1.21 - 26.3]</bold></gray>"
  line2: "<bold><gradient:#FF4B00:#FF7A00:#FFD08A>ECONOMY | CPVP</gradient></bold>"
  icon: "random"
  click-text: "<green>CLICK TO JOIN</green>"

status:
  refresh-seconds: 30

servers:
  flovexsmp:
    display-name: "FlovexSMP"
    click-text: "<green>CLICK TO JOIN</green>"
    java:
      host: "smpflovex.playwithbao.com"
      port: 33984
    bedrock:
      # Set this to the destination Geyser public address and UDP port if different.
      host: "smpflovex.playwithbao.com"
      port: 33984

allow-direct-java-addresses: false
