# McTransfer 1.1.3
messages:
  prefix: "&8[&bMcTransfer&8] "
  no-permission: "&cYou don't have permission to use this command."
  player-only: "&cOnly players can use this command."
  usage: "&cUsage: /transfer <server>"
  unknown-server: "&cUnknown server: &f%server%"
  transferring: "&aConnecting you to &f%server%&a..."
  transfer-failed: "&cCould not start the transfer. Check the destination settings."
  reloaded: "&aConfiguration reloaded."

# Player count placeholder requires PlaceholderAPI.
# Use: %mctransfer_<server-key>_players%
# Example: %mctransfer_economy_players% returns only the online count.
# You may configure up to 5 servers total. Keep server keys short, without underscores.
status:
  refresh-seconds: 30

servers:
  # Default destination: economy
  economy:
    java:
      host: "manila.playwithbao.com"
      port: 38051
    bedrock:
      host: "manila.playwithbao.com"
      port: 33984

  # Add up to 4 more entries. Copy this example and replace the key/address/port.
  # server2:
  #   java:
  #     host: "your-second-server.example"
  #     port: 25565
  #   bedrock:
  #     host: "your-second-server.example"
  #     port: 19132
  # server3:
  #   java:
  #     host: "your-third-server.example"
  #     port: 25565
  #   bedrock:
  #     host: "your-third-server.example"
  #     port: 19132
  # server4:
  #   java:
  #     host: "your-fourth-server.example"
  #     port: 25565
  #   bedrock:
  #     host: "your-fourth-server.example"
  #     port: 19132
  # server5:
  #   java:
  #     host: "your-fifth-server.example"
  #     port: 25565
  #   bedrock:
  #     host: "your-fifth-server.example"
  #     port: 19132

allow-direct-java-addresses: false
