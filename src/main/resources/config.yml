# McTransfer configuration
# Add as many destinations as you need under "servers".
# For Java players, use the destination's Java address and port.
# For Bedrock players, use the destination's public Geyser address and Bedrock port.

messages:
  prefix: "&8[&bMcTransfer&8] "
  no-permission: "&cYou don't have permission to use this command."
  player-only: "&cOnly players can use this command."
  usage: "&cUsage: /transfer <server>"
  unknown-server: "&cUnknown server: &f%server%"
  transferring: "&aConnecting you to &f%server%&a..."
  transfer-failed: "&cCould not start the transfer. Check the destination settings."
  reloaded: "&aConfiguration reloaded."

servers:
  flovexsmp:
    display-name: "FlovexSMP"
    java:
      host: "smpflovex.playwithbao.com"
      port: 33984
    bedrock:
      # This must be the public Geyser endpoint/port players use to join the destination.
      # Change it if Geyser uses a different address or Bedrock port.
      host: "smpflovex.playwithbao.com"
      port: 33984

# Optional: allow /transfer <hostname>:<port> for Java players only.
# Named destinations above are recommended for reliable crossplay.
allow-direct-java-addresses: false