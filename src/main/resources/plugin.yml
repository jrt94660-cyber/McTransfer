name: McTransfer
version: 1.1.0
main: com.flovex.mctransfer.McTransfer
api-version: '1.21.11'
folia-supported: false
description: Direct transfers with PlaceholderAPI status placeholders for FancyHolograms and FancyNpcs.
author: Flovex
softdepend: [Geyser-Spigot, Geyser, PlaceholderAPI]
commands:
  transfer:
    description: Transfer to a configured server.
    usage: /transfer <server>
    aliases: [servertransfer]
permissions:
  mctransfer.use:
    description: Allows using /transfer.
    default: true
  mctransfer.admin:
    description: Allows reloading McTransfer configuration.
    default: op
