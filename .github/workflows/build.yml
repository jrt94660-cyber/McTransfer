name: Build McTransfer
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: McTransfer-1.1.0
          path: target/McTransfer-1.1.0.jar
          if-no-files-found: error
